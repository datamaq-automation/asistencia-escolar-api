<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Asistencia Escolar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Sistema de Asistencia Escolar</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h4 mb-3">Registrar alumno</h2>
              <form id="alumno-form">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" name="nombre" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Apellido</label>
                  <input type="text" class="form-control" name="apellido" required />
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Ciclo</label>
                    <select class="form-select" name="ciclo">
                      <option value="1">1</option>
                      <option value="2">2</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label">Año</label>
                    <select class="form-select" name="anio">
                      <option value="1°">1°</option>
                      <option value="2°">2°</option>
                      <option value="3°">3°</option>
                      <option value="4°">4°</option>
                      <option value="5°">5°</option>
                      <option value="6°">6°</option>
                    </select>
                  </div>
                </div>
                <div class="mb-3 mt-3">
                  <label class="form-label">División</label>
                  <select class="form-select" name="division">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar alumno</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Nómina</h2>
                <button id="refresh-alumnos" class="btn btn-outline-primary btn-sm">Actualizar</button>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-5">
                  <label class="form-label small mb-1">Año</label>
                  <select id="filtro-anio" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="1°">1°</option>
                    <option value="2°">2°</option>
                    <option value="3°">3°</option>
                    <option value="4°">4°</option>
                    <option value="5°">5°</option>
                    <option value="6°">6°</option>
                  </select>
                </div>
                <div class="col-md-5">
                  <label class="form-label small mb-1">División</label>
                  <select id="filtro-division" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                  </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button id="filtrar-alumnos" class="btn btn-secondary btn-sm w-100">Filtrar</button>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Alumno</th>
                      <th>Ciclo</th>
                      <th>Año</th>
                      <th>División</th>
                      <th>Turno</th>
                    </tr>
                  </thead>
                  <tbody id="alumnos-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4 mt-1">
        <div class="col-lg-6">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h4 mb-3">Pasar lista</h2>
              <form id="asistencia-form">
                <div class="row g-2 mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Año</label>
                    <select class="form-select" name="anio" required>
                      <option value="1°">1°</option>
                      <option value="2°">2°</option>
                      <option value="3°">3°</option>
                      <option value="4°">4°</option>
                      <option value="5°">5°</option>
                      <option value="6°">6°</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">División</label>
                    <select class="form-select" name="division" required>
                      <option value="A">A</option>
                      <option value="B">B</option>
                      <option value="C">C</option>
                      <option value="D">D</option>
                    </select>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Fecha</label>
                  <input type="date" class="form-control" name="fecha" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Lista de alumnos</label>
                  <textarea
                    class="form-control font-monospace"
                    name="registros"
                    rows="8"
                    placeholder="[{&quot;alumno_id&quot;: 1, &quot;presente&quot;: true}, ...]"
                    required
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Guardar asistencia</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Alertas</h2>
                <div class="input-group input-group-sm" style="max-width: 200px;">
                  <span class="input-group-text">Límite</span>
                  <input id="limite-alertas" type="number" class="form-control" min="1" value="5" />
                </div>
              </div>
              <button id="refresh-alertas" class="btn btn-warning mb-3">Consultar alertas</button>
              <div id="alertas-container" class="list-group"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
